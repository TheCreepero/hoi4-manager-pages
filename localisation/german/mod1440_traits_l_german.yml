 mod1440_tre_PRC_survivor_of_the_long_march:0 "§gPersonality trait§!\nMali bei mangelndem Nachschub außerhalb des Kampfs: §G-10.0%§!\nAusrüstungseroberungsrate: §G+3.0%§!\n\n§LNahm am Langen Marsch teil§!"
 mod1440_tre_SIA_under_investigation:0 "§gStatus trait§!\n(his own) Anführerfähigkeitenboni: §R-33.0%§!\n(his own) Kann keine Kampffähigkeiten einsetzen: §Ryes§!\n\nDie militärische Untersuchungsbehörde führt derzeit eine Untersuchung gegen diesen General durch. Er wird vorerst keine drastischen Schritte unternehmen, um keine Aufmerksamkeit zu erregen."
