 mod1440_tre_JAP_samurai_lineage:0 "§gPersonality trait§!\n(his own) Beförderungskosten: §G-20.0%§!\nPlanungsgeschwindigkeit: §G+5.0%§!\nChance, im Kampf verwundet zu werden: §R+10.0%§!\n\nDieser Mann stammt aus einer stolzen Linie von Samurais und bleibt den alten Traditionen und Loyalitäten verpflichtet."
 mod1440_tre_JAP_tohokai_sympathies:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\n§LUnterstützt die Sache der Tōhōkai.§!"
