l_german:
 mod1440_tre_none:0 "§gAnother mod's trait: its effects are in the game's own tooltip.§!"
 mod1440_tre_BALTIC_anti_bolshevik:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\n§LHat gegen kommunistische Elemente gekämpft und wird das wieder tun.§!"
 mod1440_tre_BALTIC_ex_russian:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\n§LEhemaliges Mitglied der kaiserlichen russischen Armee.§!"
 mod1440_tre_CHI_dubious_loyalty:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\nDieser Character verfügt über eine sprunghafte Loyalität und es ist wahrscheinlich, dass er zur kommunistischen Partei überläuft, wenn sich die Gelegenheit ergibt."
 mod1440_tre_CHI_watched_officer:0 "§gPersonality trait§!\nErfahrungszuwachs (Anführer): §R-25.0%§!\n\nDieser Charakter verließ seinen Posten, um sich den Kommunisten anzuschließen, wurde aber wieder in das Offizierskorps aufgenommen. Er steht unter strenger Beobachtung, erhält nur wenig Verantwortung und steigt nur langsam in den Rängen auf."
 mod1440_tre_ETH_hero_of_ethiopia:0 "§gPersonality trait§!\nMoral (Armee): §G+10.0%§!\nVerteidigung (Infanterie): §G+5.0%§!\n\n§LEin wahrer Held des Landes§!"
 mod1440_tre_INS_loyalty_to_indonesia:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\nDieser Kommandant schwor Indonesien die Treue und wird sich jeder Revolution gegen die Niederlande anschließen"
 mod1440_tre_INS_loyalty_to_netherlands:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\nDieser Kommandant schwor der Niederlande die Treue und wird sich bei jeder Revolution den Niederlanden anschließen"
 mod1440_tre_INS_secret_commander:0 "§gStatus trait§!\n§gNo effect of its own.§!"
 mod1440_tre_IRQ_golden_square_member:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\nDas Goldene Quadrat besteht aus hochrangigen Militärmitgliedern, die einen neuen Weg für den Irak einschlagen wollen und sich für die Durchsetzung einer panarabischen Ideologie einsetzen. Sie sind bereit, mit jedem zusammenzuarbeiten, der ihren Zielen von Nutzen ist."
 mod1440_tre_JAP_IJA_loyalist:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\n§LWird sich im Fall eines Bürgerkriegs gegen die Regierung stellen.§!"
 mod1440_tre_JAP_communist_sympathizer:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\nUnterstützt die kommunistische Sache."
 mod1440_tre_JAP_government_supporter:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\n§LWird sich im Fall eines Bürgerkriegs der Regierung anschließen.§!"
