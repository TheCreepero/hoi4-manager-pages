 mod1440_tre_SWE_wounded_in_protests:0 "§gStatus trait§!\n(his own) Anführerfähigkeitenboni: §R-75.0%§!\n(his own) Kann keine Kampffähigkeiten einsetzen: §Ryes§!\n\nDieser Kommandant wurde bei dem Versuch verwundet, Aufstände niederzuschlagen"
