 MOD1440_AR_FIGHTING_L:0 "Fighting"
 MOD1440_AR_FIGHTING_TT:0 "Divisions in combat, as of the last count: the sum over the commanders of single armies, so that an army group is not counted twice. Divisions without a commander are not in it."
 MOD1440_AR_FOLD_TT:0 "Hide this page and give the map back (Shift+M or Escape). It stays open when its tab closes."
 MOD1440_AR_FUEL:0 "[?fuel_k|0]K of [?max_fuel_k|0]K"
 MOD1440_AR_FUEL_L:0 "Fuel"
 MOD1440_AR_FUEL_TT:0 "Fuel in store, of the most you can store: the numbers of the top bar. The bar is their share as of the last count, orange below 75%."
 MOD1440_AR_FULL:0 "Full"
 MOD1440_AR_FULL_TT:0 "Show the equipment and the armies again."
 MOD1440_AR_K_RED:0 "[?mod1440_ar_kred|R0]"
 MOD1440_AR_K_RED_L:0 "Stock cannot cover"
 MOD1440_AR_K_RED_TT:0 "Of those, the kinds whose stock cannot fill the gap, as of the last count: Short in red."
 MOD1440_AR_K_SHORT:0 "§O[?mod1440_ar_kshort|0]§!"
 MOD1440_AR_K_SHORT_L:0 "Kinds short"
 MOD1440_AR_K_SHORT_TT:0 "Kinds of equipment your divisions in the field have less of than they need, as of the last count: the kinds with a number in the Short column."
