 MOD1440_AR_NAMES:0 "Patched game"
 MOD1440_AR_NAMES_TT:0 "Tick when your hoi4.exe carries the Modding Manager's patch (Set-HoiArmyNameProperty.ps1): it gives the names of armies and army groups here and on Army Readiness, and the exact chain of command. Every game update undoes the patch: the chain of command then falls back to its guess by itself, and the names would read Himself until you untick this."
