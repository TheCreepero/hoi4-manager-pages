 MOD1440_AR_MP_ARMY_L:0 "In the army"
 MOD1440_AR_MP_ARMY_TT:0 "Men of the divisions in the field.\nIn the navy: [?deployed_navy_manpower_k|0]K\nIn the air force: [?deployed_airforce_manpower_k|0]K"
