l_japanese:
 MOD1440_AR_AH_ARM_L:0 "Arm"
 MOD1440_AR_AH_ARM_TT:0 "Divisions that are mostly armour."
 MOD1440_AR_AH_CMD_L:0 "Commander"
 MOD1440_AR_AH_CMD_TT:0 "A general or field marshal who commands troops: his portrait, name and skill, and under them the army's name and his attack, defence, planning and logistics. The army's name stands there when the game gives it to the page (a locally patched game); otherwise the army is known by its commander, as on its badge.\nClick: back to the game's order of commanders."
 MOD1440_AR_AH_DIV_L:0 "Div"
 MOD1440_AR_AH_DIV_TT:0 "Divisions under this commander. Grey for a field marshal who leads an army group: its divisions are counted again under the generals of its armies.\nClick to sort, click again to turn the order."
 MOD1440_AR_AH_EQUIP_L:0 "Equipped"
 MOD1440_AR_AH_EQUIP_TT:0 "The pieces of equipment his divisions hold, as a share of what they need, over every kind; a kind held beyond its need counts as full. As of the last count. Orange below 75%.\nClick to sort, the lowest first; click again to turn the order."
 MOD1440_AR_AH_FIGHT_L:0 "Fighting"
 MOD1440_AR_AH_FIGHT_TT:0 "Divisions of this commander in combat now, and how many of them attack and defend.\nClick to sort, click again to turn the order."
 MOD1440_AR_AH_INF_L:0 "Inf"
 MOD1440_AR_AH_INF_TT:0 "Divisions that are mostly infantry."
 MOD1440_AR_AH_MECH_L:0 "Mech"
 MOD1440_AR_AH_MECH_TT:0 "Divisions that are mostly mechanised."
 MOD1440_AR_AH_MOT_L:0 "Mot"
 MOD1440_AR_AH_MOT_TT:0 "Divisions that are mostly motorised."
 MOD1440_AR_AH_OTH_L:0 "Oth"
 MOD1440_AR_AH_OTH_TT:0 "Divisions of every other kind: cavalry, artillery, rocket and special, as of the last count (the row's tooltip names them). The five add up to Div."
 MOD1440_AR_AH_PLAN_L:0 "Planning"
 MOD1440_AR_AH_PLAN_TT:0 "The planning bonus his divisions have built up, as a share of the most they can have, as of the last count.\nClick to sort, the lowest first; click again to turn the order."
 MOD1440_AR_AH_WHERE_L:0 "Location"
 MOD1440_AR_AH_WHERE_TT:0 "The state where most of his divisions stand, as of the last count: a click moves the camera there. Under it the state of his headquarters. At sea: none of his divisions stands in a state of yours, of your faction or of an enemy."
 MOD1440_AR_AH_WORST_L:0 "Worst"
 MOD1440_AR_AH_WORST_TT:0 "The worst equipped kind of his army, with what it has as a share of what its templates ask for, as of the last count. Orange below 75%. The row's tooltip names the kind.\nClick to sort, the lowest first; click again to turn the order."
 MOD1440_AR_AL_CAPTION:0 "§g[?mod1440_ar_leaders^num|0] commanders with troops. Click one for his army's equipment, right-click for the map.§!"
 MOD1440_AR_AL_CAPTION_ONE:0 "§g1 commander with troops. Click him for his army's equipment, right-click for the map.§!"
 MOD1440_AR_AL_NONE:0 "No army has a commander yet. An army is listed here once it has one."
 MOD1440_AR_ARMIES_TITLE:0 "Armies"
 MOD1440_AR_CARD_0_TITLE:0 "Manpower"
 MOD1440_AR_CARD_1_TITLE:0 "Army"
 MOD1440_AR_CARD_2_TITLE:0 "Stocks"
 MOD1440_AR_CASUALTIES:0 "[?casualties_k|1]K"
 MOD1440_AR_CASUALTIES_L:0 "Casualties"
 MOD1440_AR_CASUALTIES_TT:0 "Men your country has lost in all of its wars, as the war overview counts them."
 MOD1440_AR_COUNT:0 "Count again"
 MOD1440_AR_COUNTED:0 "Counted [?mod1440_ar_counted.GetDateStringNoHourLong]"
 MOD1440_AR_COUNT_TT:0 "Goes through every division, every kind of equipment and every commander once. The counted figures, the equipment, the armies and where they stand are from the last time this ran: at the start of each day, and on this button."
 MOD1440_AR_DIVISIONS:0 "[?num_divisions|0]"
 MOD1440_AR_DIVISIONS_L:0 "Divisions"
 MOD1440_AR_DIVISIONS_TT:0 "Divisions in the field, with [?num_battalions|0] battalions. Divisions in training are not counted."
 MOD1440_AR_EH_FIELD_ARMY:0 "In the army"
 MOD1440_AR_EH_FIELD_L:0 "In the field"
 MOD1440_AR_EH_FIELD_TT:0 "Equipment in the hands of the divisions in the field; while an army is chosen, of that army's divisions. Red when it is less than they need.\nClick to sort, click again to turn the order."
 MOD1440_AR_EH_FILL_L:0 "Equipped"
 MOD1440_AR_EH_FILL_TT:0 "In the field as a share of needed. Orange below 75%.\nClick to sort, the lowest first; click again to turn the order."
 MOD1440_AR_EH_KIND_L:0 "Kind"
 MOD1440_AR_EH_KIND_TT:0 "The kind of equipment, with the game's picture of it.\nClick: back to the first order, the worst equipped first, then the kinds only in stock."
 MOD1440_AR_EH_NEED_L:0 "Needed"
 MOD1440_AR_EH_NEED_TT:0 "What the templates of the divisions in the field ask for; while an army is chosen, that army's. Divisions in training are not counted.\nClick to sort, click again to turn the order."
 MOD1440_AR_EH_SHORT_L:0 "Short"
 MOD1440_AR_EH_SHORT_TT:0 "What the divisions lack: needed less in the field. Red when the stock cannot fill it, orange when it can.\nClick to sort, click again to turn the order."
 MOD1440_AR_EH_STOCK_L:0 "In stock"
 MOD1440_AR_EH_STOCK_TT:0 "Equipment in the stockpile that no division and no training has taken: the number of the logistics tab, as of the last count. It is the country's, also while an army is chosen (grey then).\nClick to sort, click again to turn the order."
 MOD1440_AR_EQUIPMENT_TITLE:0 "Equipment"
 MOD1440_AR_EQ_ALL:0 "All armies"
 MOD1440_AR_EQ_ALL_TT:0 "Back to the equipment of the whole country."
 MOD1440_AR_EQ_CAPTION:0 "§gAll armies: [?mod1440_ar_fill^num|0] of [?mod1440_ar_kinds|0] kinds in use. Click a head to sort, an army below to see its own.§!"
 MOD1440_AR_EQ_CAPTION_ARMY:0 "§gThe army of§! §Y[?mod1440_ar_sel.GetName]§!§g: [?mod1440_ar_fill^num|0] kinds it needs§!"
 MOD1440_AR_EQ_CAPTION_ARMY_TT:0 "The kinds the chosen army's divisions need or hold, as of the last count: In the army and Needed are that army's, In stock is the country's (grey). Click his row again, or All armies, for the whole country."
 MOD1440_AR_EQ_CAPTION_TT:0 "A kind is listed while you have some in stock or your divisions in the field need some. The numbers are from the last count."
 MOD1440_AR_EQ_FIELD:0 "[?mod1440_ar_eqf|0]%"
 MOD1440_AR_EQ_FIELD_L:0 "Equipped in the field"
 MOD1440_AR_EQ_FIELD_TT:0 "The pieces of equipment your divisions in the field hold, as a share of what they need, over every kind; a kind held beyond its need counts as full. As of the last count. Orange below 75%. Infantry equipment outweighs the rest: the Short column and the Worst column of the armies show a kind that is short."
 MOD1440_AR_EQ_NONE:0 "No kind of land equipment in stock or needed."
