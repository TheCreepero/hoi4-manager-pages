 MOD1440_AR_NAMES:0 "Army names"
 MOD1440_AR_NAMES_TT:0 "Shows each army's name under its commander. Needs the local patch of hoi4.exe (Modding Manager, Set-HoiArmyNameProperty.ps1); without it this line would read Himself."
