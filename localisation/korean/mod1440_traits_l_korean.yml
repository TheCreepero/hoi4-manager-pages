 mod1440_tre_INS_loyalty_to_indonesia:0 "§gPersonality trait§!\n§gNo effect of its own.§!\n\n이 지휘관은 인도네시아에 충성을 맹세하며 어떠한 혁명에서든 네덜란드에 맞설 것입니다."
